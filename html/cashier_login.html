<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cashier Login</title>

    <link rel="stylesheet" href="../css/cashier_login.css">
</head>

<body>

<div class="container">

    <h1>Cashier Login</h1>

    <div id="cashierAlert" style="display:none; padding:10px 14px; border-radius:8px; margin-bottom:15px; font-size:13.5px; font-weight:600; text-align:left;"></div>

    <form id="cashierLoginForm" onsubmit="return cashierLogin(event);">

        <input type="text"
               id="cashierusername"
               name="username"
               placeholder="Enter Username or Email"
               required
               autocomplete="username">

        <input type="password"
               id="cashierpassword"
               name="password"
               placeholder="Enter Password"
               required
               autocomplete="current-password">

        <button type="submit" id="cashierLoginBtn">Login</button>

    </form>

    <p style="margin-top:20px;">
        <a href="/login.html" style="color:#2e7d32; text-decoration:none; font-weight:bold;">← Back to Role Selection</a>
    </p>

</div>

<script src="../js/cashier_login.js?v=2"></script>

</body>
</html>
